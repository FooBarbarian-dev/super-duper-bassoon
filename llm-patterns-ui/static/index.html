<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Orchestration Patterns Comparison</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🤖 LLM Orchestration Patterns</h1>
      <p class="subtitle">Compare all agent coordination strategies in parallel</p>
    </header>

    <div class="container">
      <!-- Agent Configuration -->
      <section class="config-section">
        <div class="section-header">
          <h2>Agents Configuration</h2>
          <button id="add-agent" class="btn btn-primary">+ Add Agent</button>
        </div>
        <div id="agent-list" class="agent-list"></div>
      </section>

      <!-- Input Prompt -->
      <section class="config-section">
        <h2>Input Prompt</h2>
        <textarea id="user-input" class="input-prompt" placeholder="Enter your prompt here..." rows="4"></textarea>
      </section>

      <!-- Compare Button -->
      <section class="action-section">
        <button id="compare-all" class="btn btn-compare">
          <span class="btn-icon">⚡</span>
          Compare All Patterns
        </button>
        <div id="loading" class="loading" style="display: none;">
          <div class="spinner"></div>
          <span>Running all patterns in parallel...</span>
        </div>
      </section>

      <!-- DAG Visualization -->
      <section id="dag-section" class="dag-section" style="display: none;">
        <h2>Execution Flow</h2>
        <div id="dag-container" class="dag-container"></div>
      </section>

      <!-- Results Tabs -->
      <section id="results-section" class="results-section" style="display: none;">
        <h2>Pattern Results</h2>
        <div class="tabs">
          <div class="tab-headers" id="tab-headers"></div>
          <div class="tab-contents" id="tab-contents"></div>
        </div>
      </section>

      <!-- Error Display -->
      <div id="error-message" class="error-message" style="display: none;"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
